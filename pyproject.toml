[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutvideo-offline"
version = "0.2.0"
description = "Offline DOCX-highlight driven audio editor for Windows and macOS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary application; bundled components retain their own licenses" }
authors = [{ name = "cutVideo" }]
dependencies = [
  "numpy>=1.26,<3",
  "pypinyin>=0.55,<0.56",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
ml = [
  "funasr>=1.3,<2",
  "torch>=2.5,<3",
  "torchaudio>=2.5,<3",
  "modelscope>=1.20,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "PyInstaller>=6.14,<7",
]

[project.scripts]
cutvideo = "cutvideo.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
